    <title>Password Generator ʕ•ᴥ•ʔ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e1b4b;
            --well: #0b1222;
            --well-line: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --blue: #60a5fa;
            --emerald: #34d399;
            --rose: #fb7185;
            --kaomoji: system-ui, -apple-system, 'Segoe UI', 'Segoe UI Symbol', 'Noto Sans', 'Arial Unicode MS', sans-serif;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%) fixed;
        }

        .card {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: clamp(20px, 5vw, 32px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 30px 60px -20px rgba(2, 6, 23, 0.7);
        }

        header { text-align: center; }
        h1 {
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 1.75rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        header p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.875rem;
        }

        /* ---------- The bear ---------- */
        .bear-row {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 64px;
        }
        .bear {
            flex-shrink: 0;
            min-width: 92px;
            text-align: center;
            font-family: var(--kaomoji);
            font-size: 1.45rem;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            background: none;
            border: 0;
            color: var(--text);
            padding: 4px;
            border-radius: 8px;
        }
        .bear.bounce { animation: bounce 380ms ease-out; }
        @keyframes bounce {
            0%   { transform: translateY(0); }
            35%  { transform: translateY(-7px) rotate(-4deg); }
            70%  { transform: translateY(1px) rotate(2deg); }
            100% { transform: translateY(0); }
        }
        .bubble {
            position: relative;
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .bubble::before {
            content: "";
            position: absolute;
            left: -7px;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #1f2546;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            transform: translateY(-50%) rotate(45deg);
        }

        /* ---------- Password readout ---------- */
        .readout {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 96px;
            padding: 16px 12px 16px 20px;
            background: var(--well);
            border: 1px solid var(--well-line);
            border-radius: 12px;
        }
        .readout-text { flex: 1; min-width: 0; }

        .password {
            font-family: 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
            font-size: clamp(1.15rem, 4.8vw, 1.45rem);
            font-weight: 600;
            line-height: 1.35;
            word-break: break-all;
            letter-spacing: 0.02em;
        }
        /* Symbols and digits get their own colour so 0/O and 5/S are easy to tell apart. */
        .password .d { color: var(--blue); }
        .password .s { color: var(--emerald); }
        .password.fresh { animation: settle 220ms ease-out; }
        @keyframes settle { from { opacity: 0.3; } to { opacity: 1; } }

        .translation {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.8125rem;
        }
        .translation em { color: #cbd5e1; font-style: italic; }

        .copy-btn {
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 8px;
            background: #1e293b;
            color: #cbd5e1;
            cursor: pointer;
            transition: background-color 150ms, color 150ms;
        }
        .copy-btn:hover { background: #334155; color: #fff; }
        .copy-btn svg { width: 20px; height: 20px; }
        .copy-btn .check { display: none; color: var(--emerald); }
        .copy-btn.copied .copy { display: none; }
        .copy-btn.copied .check { display: block; }

        .generate {
            width: 100%;
            padding: 14px 24px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(90deg, #2563eb, #059669);
            color: #fff;
            font: inherit;
            font-size: 1.0625rem;
            font-weight: 600;
            cursor: pointer;
            transition: filter 150ms, transform 100ms;
        }
        .generate:hover { filter: brightness(1.12); }
        .generate:active { transform: scale(0.985); }

        :focus-visible { outline: 2px solid var(--emerald); outline-offset: 2px; }

        footer {
            text-align: center;
            font-size: 0.8125rem;
            line-height: 1.5;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

        "zebu"

    const LEET = { a: '@', e: '3', i: '!', o: '0', s: '5', g: '9' };
    const SEPARATORS = ['-', '=', '+', '!', '?', '$', '*', '&', '~', '^'];
    const MAX_LENGTH = 30;

    // Uniform random integer in [0, max) from the browser's secure generator.
    function randomInt(max) {
        const limit = Math.floor(0x100000000 / max) * max; // reject to avoid modulo bias
        const buf = new Uint32Array(1);
        do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
        return buf[0] % max;
    }
    const pick = (list) => list[randomInt(list.length)];

    // Each letter: 3 in 4 chance of a symbol swap if it has one, otherwise random upper/lower case.
    function scramble(word) {
        let out = '';
        for (const ch of word) {
            if (LEET[ch] && randomInt(4) < 3) out += LEET[ch];
            else out += randomInt(2) ? ch.toUpperCase() : ch;
        }
        return out;
    }

    // Adverb + adjective + animal, e.g. "suspiciously fluffy otter", joined by one random symbol.
    // Combos longer than MAX_LENGTH are redrawn, so every allowed combo stays equally likely.
    function makePassword() {
        let words;
        do {
            words = [pick(ADVERBS), pick(ADJECTIVES), pick(ANIMALS)];
        } while (words.join('').length + 2 > MAX_LENGTH);
        const sep = pick(SEPARATORS);
        return { password: words.map(scramble).join(sep), words };
    }

    // ---------- The bear's personality (cosmetic only, uses Math.random) ----------
    const FACES = {
        neutral:  'ʕ•ᴥ•ʔ',
        happy:    'ʕ ᵔᴥᵔ ʔ',
        proud:    'ʕ•̀ω•́ʔ✧',
        hug:      'ʕっ•ᴥ•ʔっ',
        meh:      'ʕ – ᴥ – ʔ',
        annoyed:  'ʕ •`ᴥ•´ʔ',
        shocked:  'ʕ ◉ᴥ◉ ʔ',
        sad:      'ʕ ´•̥ ᴥ •̥`ʔ',
        sleepy:   'ʕ ꈍᴥꈍʔ zzz',
        flip:     'ʕノ•ᴥ•ʔノ ︵ ┻━┻',
        unflip:   '┬─┬ ノʕ•ᴥ•ノʔ',
        wink:     'ʕ ´•ᴥ<ʔ',
    };

    const aOrAn = (phrase) => (/^[aeiou]/.test(phrase) ? 'an ' : 'a ') + phrase;
    const cap = (str) => str.charAt(0).toUpperCase() + str.slice(1);

    const NEW_LINES = [
        (p) => `Behold: ${aOrAn(p)}. You're fucking welcome.`,
        (p) => `Somewhere out there, ${aOrAn(p)} is judging your shitty old passwords.`,
        (p) => `${cap(aOrAn(p))} would never reuse a password. Be the damn ${p.split(' ').pop()}.`,
        (p) => `"${cap(p)}" is also the name of my band now. We suck.`,
        (p) => `${cap(aOrAn(p))}. Hackers hate this one weird-ass animal.`,
        (p) => `Picture ${aOrAn(p)}. Hell yes. Now never think about it again.`,
        ()  => `Fresh out of the oven. Reuse it and I'll lose my shit.`,
        ()  => `Hand-crafted by a bear. Zero humans were consulted, thank god.`,
        ()  => `Stronger than "password123". Low bar, but damn, you needed this.`,
        ()  => `If you write this on a sticky note, I swear to god I will find you.`,
        ()  => `Certified fresh. Not certified sane. Who gives a crap.`,
        ()  => `Another masterpiece. I should be charging for this shit.`,
    ];
    const NEW_FACES = ['happy', 'proud', 'neutral', 'wink'];

    const COPY_LINES = [
        `Copied. Now go paste it somewhere responsible, dammit.`,
        `On your clipboard. Tape it to your monitor and I'll bite your ass.`,
        `Copied! Your password manager is gonna love this shit.`,
        `Done. One password, one site. Don't fuck this up.`,
        `Copied. Use it before I change my damn mind.`,
    ];

    const MILESTONES = {
        10:  ['meh',     `That's ten. Commitment issues much?`],
        25:  ['annoyed', `Twenty-five. They're all good, for fuck's sake. Pick one.`],
        50:  ['flip',    `FIFTY. I'm a bear, not a goddamn slot machine.`],
        51:  ['unflip',  `...sorry. I'm fine. Here's another one, jackass.`],
        100: ['shocked', `A HUNDRED? Holy shit. They're random, you know that, right?`],
    };

    const POKE_LINES = [
        ['annoyed', `Do you mind? I'm fucking working here.`],
        ['shocked', `Hey! Paws off, asshole.`],
        ['meh',     `Poking the bear. Bold strategy, dumbass.`],
        ['happy',   `Fine. One poke. That's all you get, damn it.`],
        ['wink',    `Psst. Different password on every site. Or else.`],
    ];

    const els = {
        password: document.getElementById('password'),
        translation: document.getElementById('translation'),
        copyBtn: document.getElementById('copy-btn'),
        generateBtn: document.getElementById('generate-btn'),
        bear: document.getElementById('bear'),
        bubble: document.getElementById('bubble'),
    };

    const flavour = (list) => list[Math.floor(Math.random() * list.length)];
    let current = '';
    let count = 0;
    let lastLine = -1;
    let idleTimer;
    let copiedTimer;

    function say(face, text) {
        els.bear.textContent = FACES[face] || FACES.neutral;
        els.bubble.textContent = text;
        els.bear.classList.remove('bounce');
        void els.bear.offsetWidth;
        els.bear.classList.add('bounce');
        resetIdle();
    }

    function resetIdle() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            els.bear.textContent = FACES.sleepy;
            els.bubble.textContent = `Wake me when you need another damn password.`;
        }, 60000);
    }

    function show({ password, words }) {
        current = password;
        const frag = document.createDocumentFragment();
        for (const ch of password) {
            const span = document.createElement('span');
            span.textContent = ch;
            if (/[0-9]/.test(ch)) span.className = 'd';
            else if (!/[a-z]/i.test(ch)) span.className = 's';
            frag.appendChild(span);
        }
        els.password.replaceChildren(frag);
        els.password.classList.remove('fresh');
        void els.password.offsetWidth;
        els.password.classList.add('fresh');
        els.translation.textContent = words.join(' ');
        return words.join(' ');
    }

    function generate() {
        const phrase = show(makePassword());
        count++;
        if (MILESTONES[count]) {
            say(...MILESTONES[count]);
            return;
        }
        let i;
        do { i = Math.floor(Math.random() * NEW_LINES.length); } while (i === lastLine);
        lastLine = i;
        say(flavour(NEW_FACES), NEW_LINES[i](phrase));
    }

    async function writeClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        if (!ok) throw new Error('Copy failed');
    }

    els.copyBtn.addEventListener('click', async () => {
        try {
            await writeClipboard(current);
            els.copyBtn.classList.add('copied');
            clearTimeout(copiedTimer);
            copiedTimer = setTimeout(() => els.copyBtn.classList.remove('copied'), 1600);
            say('hug', flavour(COPY_LINES));
        } catch {
            say('sad', `Your stupid browser won't let me copy. Select it and copy it yourself, you've got hands.`);
        }
    });

    els.generateBtn.addEventListener('click', generate);
    els.bear.addEventListener('click', () => say(...flavour(POKE_LINES)));

    show(makePassword());
    resetIdle();
    </script>
