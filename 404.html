<body>
    <div>

            <div class="buttons"><a id="home" class="btn" href="/">OK, take me home</a></div>
        </div>
        <small>Error 404: page not found. Bear found. Bear full.</small>
    </div>
    <script>
        // on github pages the site lives at /repo-name/, so send ppl back there instead of the root
        if (location.hostname.endsWith('.github.io')) {
            const repo = location.pathname.split('/').filter(Boolean)[0];
            const userSite = location.hostname.replace('.github.io', '') + '.github.io';
            if (repo && repo !== userSite) document.getElementById('home').href = '/' + repo + '/';
        }
    </script>
